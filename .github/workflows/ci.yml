name: CI

on:
  push:
    branches:
      - main
      - refactor/**
  pull_request:
    branches:
      - main

jobs:
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend-smoke:
    name: Backend smoke checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight check dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML==6.0.2 httpx==0.27.0 pydantic==2.6.1 pydantic-settings==2.1.0 python-dotenv==1.0.1

      - name: Compile backend source
        run: python -m compileall app sitecustomize.py

      - name: Validate provider config can load
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from app.core.model_providers import public_provider_payload
          payload = public_provider_payload(refresh_dynamic=False)
          assert payload.get('providers'), 'No model providers returned'
          assert payload.get('default_provider'), 'No default provider configured'
          print('default_provider=', payload['default_provider'])
          print('providers=', [p['id'] for p in payload['providers']])
          PY

      - name: Validate vision metadata helpers
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from app.services.vision_metadata import normalize_vision, focus_result_from_vision
          from app.services.semantic_dedup import semantic_similarity

          raw = {
              'crop_square': {'cx': 2, 'cy': -1, 'side': 0},
              'subject_bbox': {'x1': -1, 'y1': 0.1, 'x2': 1.2, 'y2': 0.9},
              'pose_family': 'standing',
              'shot_type': 'full_body',
              'view_angle': 'front',
          }
          vision = normalize_vision(raw)
          assert vision['crop_square']['cx'] == 1.0
          assert vision['crop_square']['cy'] == 0.0
          assert vision['crop_square']['side'] >= 0.05
          focus = focus_result_from_vision(vision)
          assert focus['focus_point']['x'] == vision['crop_square']['cx']

          a = normalize_vision({
              'shot_type': 'full_body',
              'body_visibility': 'full_body',
              'pose_family': 'standing',
              'view_angle': 'front',
              'pose_signature': {'left_arm': 'down', 'right_arm': 'near_face'},
              'subject_bbox': {'x1': 0.1, 'y1': 0.05, 'x2': 0.8, 'y2': 0.95},
          })
          b = normalize_vision({
              'shot_type': 'full_body',
              'body_visibility': 'full_body',
              'pose_family': 'standing',
              'view_angle': 'front',
              'pose_signature': {'left_arm': 'down', 'right_arm': 'near_face'},
              'subject_bbox': {'x1': 0.12, 'y1': 0.05, 'x2': 0.82, 'y2': 0.95},
          })
          score = semantic_similarity(a, b)
          assert score['is_similar'] is True
          print('semantic_score=', score)
          PY

      - name: Validate safe zip extraction patch
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import os
          import tempfile
          import zipfile
          import sitecustomize  # noqa: F401, ensures patch is active

          with tempfile.TemporaryDirectory() as tmp:
              archive = os.path.join(tmp, 'sample.zip')
              out_dir = os.path.join(tmp, 'out')
              os.makedirs(out_dir, exist_ok=True)
              with zipfile.ZipFile(archive, 'w') as zf:
                  zf.writestr('safe/测试.jpg', b'data')
              with zipfile.ZipFile(archive, 'r') as zf:
                  info = zf.infolist()[0]
                  zf.extract(info, out_dir)
                  assert os.path.exists(os.path.join(out_dir, 'safe', '测试.jpg'))

              evil = os.path.join(tmp, 'evil.zip')
              with zipfile.ZipFile(evil, 'w') as zf:
                  zf.writestr('../evil.jpg', b'data')
              with zipfile.ZipFile(evil, 'r') as zf:
                  try:
                      zf.extract(zf.infolist()[0], out_dir)
                  except ValueError:
                      pass
                  else:
                      raise AssertionError('unsafe zip path was not rejected')
          PY
